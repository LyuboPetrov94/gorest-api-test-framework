name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# One GoRest token = one 300 req/min bucket shared across every run. Never let
# two runs draw it down at the same time: cancel an in-progress run for this
# ref when a newer one starts.
concurrency:
  group: gorest-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API suite (typecheck + test:api)
    runs-on: ubuntu-latest
    env:
      # Repository secret. Add via Settings -> Secrets and variables -> Actions.
      # The authedRequest fixture throws at load if this is missing, so a
      # missing secret fails loudly instead of emitting silent 401s.
      GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Node 22 = current maintenance LTS; matches the README's documented
          # minimum. (Node 20 reached end-of-life in 2026.)
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # No `npx playwright install`: the API request context (authedRequest)
      # talks HTTP directly and needs no browser binaries. workers:1 on CI is
      # set in playwright.config.ts via process.env.CI, keeping the suite under
      # the rate limit.
      - name: Run API tests (excludes @ratelimit burst)
        run: npm run test:api

      # Turn the JSON results (emitted by the json reporter on CI) into a
      # readable table on the run's Summary tab. Runs even on failure; guards
      # against a missing/unparseable file so it never breaks the build.
      - name: Test summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const out = process.env.GITHUB_STEP_SUMMARY;
            try {
              const r = JSON.parse(fs.readFileSync("results.json", "utf8"));
              const s = r.stats || {};
              const pass = s.expected || 0, fail = s.unexpected || 0;
              const flaky = s.flaky || 0, skipped = s.skipped || 0;
              const total = pass + fail + flaky + skipped;
              const dur = s.duration ? (s.duration / 1000).toFixed(1) + "s" : "n/a";
              fs.appendFileSync(out,
                "## API suite results\n\n" +
                "| Result | Count |\n|---|---:|\n" +
                "| Passed | " + pass + " |\n" +
                "| Failed | " + fail + " |\n" +
                "| Flaky | " + flaky + " |\n" +
                "| Skipped | " + skipped + " |\n" +
                "| **Total** | **" + total + "** |\n\n" +
                "Duration: " + dur + "\n");
            } catch (e) {
              fs.appendFileSync(out, "Could not build test summary: " + e.message + "\n");
            }
          '

      # Always upload the HTML report - kept even when every test passes, not
      # just on failure - so each run leaves a structured, browsable artifact.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: error

  rate-limit:
    name: Rate-limit burst (advisory)
    needs: test
    runs-on: ubuntu-latest
    # Advisory: a 429 depends on the token's real-time bucket state, not on a
    # code defect, so a miss reports status without turning the build red.
    continue-on-error: true
    env:
      GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cooldown: let the token's bucket refill after the `test` job before the
      # burst deliberately drains it. The jobs run on separate runners but share
      # one token; provisioning + npm ci already adds delay, this is belt-and-braces.
      - name: Cool down (let the token bucket refill)
        run: sleep 60

      - name: Run @ratelimit burst
        run: npm run test:ratelimit

  deploy-report:
    name: Publish report to GitHub Pages
    needs: test
    # Only publish from master pushes - PRs can't deploy Pages, and we don't
    # want PR runs overwriting the published report. (needs: test means this is
    # skipped if the suite failed, so only passing reports get published.)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Pages deployment needs these scopes; granted only to this job.
    permissions:
      pages: write
      id-token: write
    # Serialize Pages deploys so two runs never clobber each other mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the HTML report (from the test job)
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report

      - name: Package it as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
