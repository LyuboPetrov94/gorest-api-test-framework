name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# One GoRest token = one 300 req/min bucket shared across every run. Never let
# two runs draw it down at the same time: cancel an in-progress run for this
# ref when a newer one starts.
concurrency:
  group: gorest-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static checks (lint, format, typecheck)
    runs-on: ubuntu-latest
    # No tokens needed - none of these touch the API. Runs on EVERY event,
    # including Dependabot and fork PRs (which do not receive repository
    # secrets), so dependency bumps still get linted and type-checked. Parallel
    # with the test job.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

  test:
    name: API suite (typecheck + test:api)
    runs-on: ubuntu-latest
    # The API suite needs GOREST_TOKEN_MAIN. (The cross-account isolation spec
    # is excluded here - tagged @isolation - and runs in its own `isolation`
    # job below.) Dependabot PRs and fork PRs do NOT receive repository secrets,
    # so skip there (the lint job still lints and type-checks them); the full
    # suite validates on every push to master.
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    env:
      # Repository secret. Add via Settings -> Secrets and variables -> Actions.
      # authedRequest throws at load if GOREST_TOKEN_MAIN is missing (fails
      # loudly instead of silent 401s). GOREST_TOKEN_SUB is NOT needed here -
      # the spec that uses it runs in the separate `isolation` job below.
      GOREST_TOKEN_MAIN: ${{ secrets.GOREST_TOKEN_MAIN }}
      # Unique blob filename so merge-report can combine every job's results.
      PW_BLOB_NAME: main
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 22 = current maintenance LTS; matches the README's documented
          # minimum. (Node 20 reached end-of-life in 2026.)
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # No `npx playwright install`: the API request context (authedRequest)
      # talks HTTP directly and needs no browser binaries. workers:1 on CI is
      # set in playwright.config.ts via process.env.CI, keeping the suite under
      # the rate limit.
      - name: Run API tests (excludes @ratelimit + @isolation)
        run: npm run test:api

      # Turn the JSON results (emitted by the json reporter on CI) into a
      # readable table on the run's Summary tab. Runs even on failure; guards
      # against a missing/unparseable file so it never breaks the build.
      - name: Test summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const out = process.env.GITHUB_STEP_SUMMARY;
            try {
              const r = JSON.parse(fs.readFileSync("results.json", "utf8"));
              const s = r.stats || {};
              const pass = s.expected || 0, fail = s.unexpected || 0;
              const flaky = s.flaky || 0, skipped = s.skipped || 0;
              const total = pass + fail + flaky + skipped;
              const dur = s.duration ? (s.duration / 1000).toFixed(1) + "s" : "n/a";
              fs.appendFileSync(out,
                "## API suite results\n\n" +
                "| Result | Count |\n|---|---:|\n" +
                "| Passed | " + pass + " |\n" +
                "| Failed | " + fail + " |\n" +
                "| Flaky | " + flaky + " |\n" +
                "| Skipped | " + skipped + " |\n" +
                "| **Total** | **" + total + "** |\n\n" +
                "Duration: " + dur + "\n");
            } catch (e) {
              fs.appendFileSync(out, "Could not build test summary: " + e.message + "\n");
            }
          '

      # Upload this job's blob report (always, even on failure) for merge-report
      # to combine with the isolation + rate-limit blobs into one HTML report.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-main
          path: blob-report/
          retention-days: 30
          if-no-files-found: error

  isolation:
    name: Cross-account isolation
    runs-on: ubuntu-latest
    # Needs BOTH a main and a second-account token, neither of which secret-less
    # Dependabot/fork PRs receive - so skip there, same guard as `test`. Runs in
    # PARALLEL with `test` (it is light: ~17 requests, mostly on the second
    # account's separate bucket) and finishes well before the rate-limit burst.
    # NOT advisory: a real isolation regression should show red. But it is its
    # own job, so a lapsed second-account token reddens only THIS job - the main
    # suite stays green and the failure is obviously the second-account one.
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    env:
      GOREST_TOKEN_MAIN: ${{ secrets.GOREST_TOKEN_MAIN }}
      GOREST_TOKEN_SUB: ${{ secrets.GOREST_TOKEN_SUB }}
      PW_BLOB_NAME: isolation
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run cross-account isolation spec (@isolation)
        run: npm run test:isolation

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-isolation
          path: blob-report/
          retention-days: 30
          if-no-files-found: error

  rate-limit:
    name: Rate-limit burst (advisory)
    needs: test
    runs-on: ubuntu-latest
    # Advisory: a 429 depends on the token's real-time bucket state, not on a
    # code defect, so a miss reports status without turning the build red.
    continue-on-error: true
    env:
      # Rate-limit burst uses the MAIN token only (authedRequest); no second
      # account is involved.
      GOREST_TOKEN_MAIN: ${{ secrets.GOREST_TOKEN_MAIN }}
      PW_BLOB_NAME: ratelimit
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cooldown: let the token's bucket refill after the `test` job before the
      # burst deliberately drains it. The jobs run on separate runners but share
      # one token; provisioning + npm ci already adds delay, this is belt-and-braces.
      - name: Cool down (let the token bucket refill)
        run: sleep 60

      - name: Run @ratelimit burst
        run: npm run test:ratelimit

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-ratelimit
          path: blob-report/
          retention-days: 30
          if-no-files-found: error

  merge-report:
    name: Merge reports (all jobs)
    needs: [test, isolation, rate-limit]
    # Combine the three jobs' blob reports into ONE HTML report covering every
    # test. Runs on master pushes only; `!cancelled()` lets it run even when a
    # test job failed, so the published report always reflects the COMPLETE
    # latest results (including any reds). PRs do not publish.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge blobs into one HTML report (all tests)
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: error

  deploy-report:
    name: Publish report to GitHub Pages
    needs: merge-report
    # Publishes the MERGED report (all jobs) from master pushes only - PRs can't
    # deploy Pages. merge-report runs even when a test job failed, so the
    # published report always reflects the complete latest results.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Pages deployment needs these scopes; granted only to this job.
    permissions:
      pages: write
      id-token: write
    # Serialize Pages deploys so two runs never clobber each other mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the merged HTML report
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report

      - name: Package it as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
